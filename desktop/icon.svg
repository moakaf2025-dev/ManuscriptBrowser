<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2016"/>
      <stop offset="100%" stop-color="#1a1108"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e5c2"/>
      <stop offset="100%" stop-color="#d8bf88"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b64f"/>
      <stop offset="100%" stop-color="#a67519"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle grain overlay -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#gold)" opacity="0.04"/>

  <!-- Manuscript pages: two facing pages (RTL: right is the 'a' page) -->
  <g filter="url(#shadow)" transform="translate(256 256)">
    <!-- Left page (verso 1b) -->
    <path d="M -140 -150 L -10 -155 L -10 155 L -140 145 Z" fill="url(#parchment)" stroke="#7c5d2a" stroke-width="2"/>
    <!-- Right page (recto 1a) -->
    <path d="M 140 -150 L 10 -155 L 10 155 L 140 145 Z" fill="url(#parchment)" stroke="#7c5d2a" stroke-width="2"/>
    <!-- Spine/fold -->
    <line x1="0" y1="-152" x2="0" y2="150" stroke="#5c4318" stroke-width="3"/>

    <!-- Text lines on right page (a) -->
    <g stroke="#3f2f14" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="20" y1="-110" x2="130" y2="-108"/>
      <line x1="20" y1="-85" x2="130" y2="-83"/>
      <line x1="20" y1="-60" x2="130" y2="-58"/>
      <line x1="20" y1="-35" x2="130" y2="-33"/>
      <line x1="20" y1="-10" x2="130" y2="-8"/>
      <line x1="20" y1="15" x2="130" y2="17"/>
      <line x1="20" y1="40" x2="130" y2="42"/>
      <line x1="20" y1="65" x2="130" y2="67"/>
      <line x1="20" y1="90" x2="130" y2="92"/>
      <line x1="20" y1="115" x2="130" y2="117"/>
    </g>
    <!-- Text lines on left page (b) -->
    <g stroke="#3f2f14" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <line x1="-130" y1="-112" x2="-20" y2="-110"/>
      <line x1="-130" y1="-87" x2="-20" y2="-85"/>
      <line x1="-130" y1="-62" x2="-20" y2="-60"/>
      <line x1="-130" y1="-37" x2="-20" y2="-35"/>
      <line x1="-130" y1="-12" x2="-20" y2="-10"/>
      <line x1="-130" y1="13" x2="-20" y2="15"/>
      <line x1="-130" y1="38" x2="-20" y2="40"/>
      <line x1="-130" y1="63" x2="-20" y2="65"/>
      <line x1="-130" y1="88" x2="-20" y2="90"/>
      <line x1="-130" y1="113" x2="-20" y2="115"/>
    </g>

    <!-- Golden ruler across the current line -->
    <rect x="-140" y="-2" width="280" height="18" rx="3" fill="url(#gold)" opacity="0.72"/>
    <rect x="-140" y="-2" width="280" height="18" rx="3" fill="none" stroke="#7d5714" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Corner accent: small Arabic mark (م for متصفح) -->
  <g transform="translate(410 100)">
    <circle cx="0" cy="0" r="42" fill="url(#gold)" filter="url(#shadow)"/>
    <text x="0" y="18" font-family="Amiri, 'Traditional Arabic', serif" font-size="60" text-anchor="middle" fill="#2b2016" font-weight="700">م</text>
  </g>
</svg>
